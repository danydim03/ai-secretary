name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-and-extraction:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install project and extraction libraries
        run: python -m pip install .
      - name: Run unit and fixture tests
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -v
