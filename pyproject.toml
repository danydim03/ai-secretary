[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-secretary"
version = "0.3.0"
description = "Local-first, provenance-preserving document assistant"
requires-python = ">=3.9"
dependencies = ["pymupdf>=1.24", "python-docx>=1.1"]

[project.scripts]
secretary = "secretary.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
